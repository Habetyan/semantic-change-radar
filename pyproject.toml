[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-change-radar"
version = "0.1.0"
description = "Compare meaning across document versions with passage alignment and bidirectional NLI."
requires-python = ">=3.10,<3.13"
license = "MIT"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["radar*"]

[project.scripts]
change-radar = "radar.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["model: loads downloaded ONNX models (opt-in)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
